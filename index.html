<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For You 💙</title>
<style>
  :root{
    --bg1:#0a1a4a; --bg2:#1d4ed8; --bg3:#38bdf8;
    --card:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,sans-serif;
    color:#fff;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:300% 300%;
    animation:bgmove 14s ease infinite;
    overflow-x:hidden;
  }
  @keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* floating bubbles */
  #bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bubble{
    position:absolute;bottom:-60px;border-radius:50%;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    animation:rise linear infinite;
  }
  @keyframes rise{to{transform:translateY(-120vh) translateX(30px);opacity:0}}

  .screen{
    position:relative;z-index:1;min-height:100vh;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .screen.active{display:flex;animation:fadein .8s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- Page 1 ---------- */
  .heart{font-size:72px;animation:beat 1.2s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  h1.question{font-size:clamp(34px,8vw,64px);margin:18px 0 34px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
  .btns{display:flex;gap:22px;align-items:center;justify-content:center;min-height:90px}
  button{
    font-family:inherit;border:none;cursor:pointer;color:#fff;font-weight:700;
    border-radius:999px;transition:transform .25s ease, box-shadow .25s ease;
  }
  #yes{
    padding:16px 44px;font-size:22px;
    background:linear-gradient(135deg,#22d3ee,#2563eb);
    box-shadow:0 8px 24px rgba(37,99,235,.55);
  }
  #yes:hover{transform:scale(1.08)}
  #no{
    padding:16px 40px;font-size:22px;
    background:linear-gradient(135deg,#475569,#1e293b);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    transition:transform .35s ease, opacity .35s ease;
    transform-origin:center;
  }
  #no.gone{opacity:0;pointer-events:none;width:0;padding:0;margin:0;overflow:hidden}
  .hint{margin-top:26px;opacity:.8;min-height:24px;font-size:16px}

  /* ---------- Page 2 ---------- */
  #screen2{justify-content:flex-start;padding-top:40px;gap:22px}
  #typing{
    font-size:clamp(28px,7vw,58px);font-weight:800;min-height:1.3em;
    text-shadow:0 4px 24px rgba(0,0,0,.4);
  }
  #typing::after{content:"|";animation:blink 1s infinite;margin-left:4px}
  @keyframes blink{50%{opacity:0}}
  #sub{font-size:clamp(16px,4vw,22px);opacity:0;transition:opacity 1.2s ease;max-width:560px;line-height:1.5}
  #sub.show{opacity:.95}

  .slideshow{
    width:min(92vw,520px);aspect-ratio:4/5;position:relative;
    border-radius:22px;overflow:hidden;background:var(--card);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    opacity:0;transform:scale(.95);transition:all 1s ease;
  }
  .slideshow.show{opacity:1;transform:none}
  .slide{
    position:absolute;inset:0;opacity:0;transition:opacity 1s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .slide.on{opacity:1}
  .slide img{width:100%;height:100%;object-fit:cover}
  .slide .ph{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:64px;gap:10px;
    background:linear-gradient(135deg,#1e40af,#0ea5e9);
  }
  .slide .ph small{font-size:14px;opacity:.85}
  .caption{
    position:absolute;left:0;right:0;bottom:0;padding:34px 16px 16px;
    background:linear-gradient(transparent,rgba(0,0,0,.6));font-size:18px;font-weight:600;
  }
  .nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:42px;height:42px;font-size:20px;background:rgba(0,0,0,.4);
  }
  .nav:hover{background:rgba(0,0,0,.65)}
  #prev{left:10px}#next{right:10px}
  .dots{display:flex;gap:8px;justify-content:center}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);transition:.3s}
  .dot.on{background:#fff;transform:scale(1.3)}

  /* ---------- Popup ---------- */
  #popup{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(2,10,40,.65);backdrop-filter:blur(6px);
  }
  #popup.open{display:flex}
  .pop-card{
    background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
    padding:40px 34px;border-radius:26px;text-align:center;max-width:90vw;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
    animation:pop .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .pop-card h2{font-size:clamp(30px,8vw,52px);margin:10px 0}
  .pop-card p{font-size:18px;margin-bottom:22px;opacity:.95}
  .pop-card button{padding:14px 34px;font-size:18px;background:#fff;color:#1d4ed8}
  .emoji-big{font-size:68px}

  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>

<div id="bubbles"></div>
<canvas id="confetti"></canvas>

<!-- PAGE 1 -->
<section class="screen active" id="screen1">
  <div class="heart">💙</div>
  <h1 class="question">Treat Dega?</h1>
  <div class="btns">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
  <p class="hint" id="hint"></p>
</section>

<!-- PAGE 2 -->
<section class="screen" id="screen2">
  <div id="typing"></div>
  <p id="sub"></p>

  <div class="slideshow" id="slideshow">
    <button class="nav" id="prev">❮</button>
    <button class="nav" id="next">❯</button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<!-- POPUP -->
<div id="popup">
  <div class="pop-card">
    <div class="emoji-big">🎂🎉</div>
    <h2>Happy Birthday!</h2>
    <p id="popName"></p>
    <button id="popClose">Open your surprise 💙</button>
  </div>
</div>

<script>
/* =========================================================
   EDIT THIS SECTION ONLY
   ========================================================= */
const FRIEND_NAME = "Arshad";      // <-- friend's name here
const MY_MESSAGE  = "Wishing you a year full of happiness, success and endless good vibes. You deserve the best of everything! 💙";
const PHOTOS = [
  // put your photos in a folder named "photos" next to index.html
  { src: "photos/1.jpg", caption: "Where it all began 😄" },
  { src: "photos/2.jpg", caption: "Unforgettable moments 📸" },
  { src: "photos/3.jpg", caption: "Best times together 💙" },
  { src: "photos/4.jpg", caption: "Here's to many more 🥳" }
];
/* ========================================================= */

/* ---------- bubbles ---------- */
const bubbleBox = document.getElementById("bubbles");
for (let i = 0; i < 28; i++) {
  const b = document.createElement("span");
  b.className = "bubble";
  const s = 8 + Math.random() * 40;
  b.style.width = b.style.height = s + "px";
  b.style.left = Math.random() * 100 + "%";
  b.style.animationDuration = 8 + Math.random() * 14 + "s";
  b.style.animationDelay = -Math.random() * 14 + "s";
  bubbleBox.appendChild(b);
}

/* ---------- page 1 logic ---------- */
const yes = document.getElementById("yes");
const no  = document.getElementById("no");
const hint = document.getElementById("hint");
const hints = ["Are you sure? 🥺", "Think again... 💙", "Last chance! 😢", "Okay okay, no more 'No' 😏"];
let noClicks = 0;

no.addEventListener("click", () => {
  noClicks++;
  if (noClicks >= 4) {
    no.classList.add("gone");
    hint.textContent = hints[3];
    return;
  }
  no.style.transform = `scale(${1 - noClicks * 0.22})`;
  hint.textContent = hints[noClicks - 1];
});

yes.addEventListener("click", () => {
  document.getElementById("popName").textContent = "Dear " + FRIEND_NAME + " 💙";
  document.getElementById("popup").classList.add("open");
  burst();
});

/* ---------- popup close -> page 2 ---------- */
document.getElementById("popClose").addEventListener("click", () => {
  document.getElementById("popup").classList.remove("open");
  document.getElementById("screen1").classList.remove("active");
  document.getElementById("screen2").classList.add("active");
  startPage2();
});

/* ---------- typing effect ---------- */
function typeText(el, text, speed, done) {
  let i = 0;
  (function step() {
    el.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(step, speed);
    else if (done) done();
  })();
}

function startPage2() {
  burst();
  buildSlideshow();
  typeText(document.getElementById("typing"), "Happy Birthday, " + FRIEND_NAME + "! 🎂", 90, () => {
    const sub = document.getElementById("sub");
    sub.textContent = MY_MESSAGE;
    sub.classList.add("show");
    document.getElementById("slideshow").classList.add("show");
    burst();
  });
}

/* ---------- slideshow ---------- */
let current = 0, timer;
function buildSlideshow() {
  const box = document.getElementById("slideshow");
  const dots = document.getElementById("dots");
  PHOTOS.forEach((p, i) => {
    const slide = document.createElement("div");
    slide.className = "slide" + (i === 0 ? " on" : "");
    const img = new Image();
    img.src = p.src;
    img.alt = p.caption;
    img.onerror = () => {
      img.remove();
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.innerHTML = "📷<small>Add " + p.src + "</small>";
      slide.prepend(ph);
    };
    slide.appendChild(img);
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = p.caption;
    slide.appendChild(cap);
    box.appendChild(slide);

    const d = document.createElement("span");
    d.className = "dot" + (i === 0 ? " on" : "");
    d.onclick = () => { go(i); resetTimer(); };
    dots.appendChild(d);
  });
  document.getElementById("prev").onclick = () => { go(current - 1); resetTimer(); };
  document.getElementById("next").onclick = () => { go(current + 1); resetTimer(); };
  resetTimer();
}
function go(n) {
  const slides = document.querySelectorAll(".slide");
  const dots = document.querySelectorAll(".dot");
  slides[current].classList.remove("on");
  dots[current].classList.remove("on");
  current = (n + slides.length) % slides.length;
  slides[current].classList.add("on");
  dots[current].classList.add("on");
}
function resetTimer() {
  clearInterval(timer);
  timer = setInterval(() => go(current + 1), 3500);
}

/* ---------- confetti ---------- */
const cv = document.getElementById("confetti");
const cx = cv.getContext("2d");
let pieces = [], running = false;
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize); resize();

function burst() {
  const colors = ["#ffffff", "#38bdf8", "#22d3ee", "#60a5fa", "#facc15", "#f472b6"];
  for (let i = 0; i < 160; i++) {
    pieces.push({
      x: innerWidth / 2, y: innerHeight / 2.2,
      vx: (Math.random() - 0.5) * 16,
      vy: Math.random() * -14 - 3,
      g: 0.28 + Math.random() * 0.15,
      s: 5 + Math.random() * 7,
      r: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.3,
      c: colors[(Math.random() * colors.length) | 0],
      life: 140 + Math.random() * 60
    });
  }
  if (!running) { running = true; loop(); }
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  pieces = pieces.filter(p => p.life-- > 0 && p.y < cv.height + 20);
  pieces.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
    cx.restore();
  });
  if (pieces.length) requestAnimationFrame(loop);
  else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}
</script>
</body>
</html>
